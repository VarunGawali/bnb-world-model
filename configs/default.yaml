# default.yaml — BnB World Model default hyperparameters
# Override any field via CLI: --model.hidden_dim 64

model:
  hidden_dim: 128
  n_gnn_layers: 3
  n_gnn_heads: 4          # GATv2Conv attention heads (head_dim = hidden_dim // n_gnn_heads)
  n_dyn_layers: 4         # Transformer dynamics depth
  n_dyn_heads: 4          # Transformer attention heads
  max_seq: 512            # maximum B&B trajectory length
  # Multi-step-rollout stabilisers (see dynamics.py). residual: predict
  # z_{t+1}=LayerNorm(z_t+delta) — on by default, reduces compounding drift.
  # heteroscedastic: also predict per-dim variance, train with Gaussian NLL —
  # off by default (safe stochastic-aware option, no KL/sampling).
  dyn_residual: true
  dyn_heteroscedastic: false

training:
  # Epoch numbers are CAPS, not fixed durations: early stopping (patience below)
  # halts each phase when val stops improving and the best checkpoint is kept.
  # Modest caps keep worst-case runtime bounded; raise them if a phase is still
  # improving when it hits the cap (i.e. it ends without an "Early stop" line).
  epochs_phase1: 30     # policy head
  epochs_phase2: 25     # value head
  epochs_phase3: 60     # dynamics Transformer — the world-model core; needs more
                        # (cheap: encode-once cache, only epoch 1 pays encoding)
  overshoot_depth: 3    # Phase 3 latent-overshooting horizon (0 = one-step only)
  cand_rank_weight: 0.5 # Phase 3 candidate-ranking loss weight (0 = disabled)
  epochs_phase4: 25     # joint fine-tuning
  epochs_phase5: 20     # cut selection head
  patience: 6           # early-stop after this many epochs without val improvement
  patience_phase3: 12   # Phase 3 gets MORE patience: the overshoot curriculum
                        # (k ramps 1->3) transiently raises val loss when k steps
                        # up, which patience-6 would misread as a plateau and
                        # stop the dynamics phase mid-curriculum.
  batch_size: 32    # With size-aware batching (train.py --size_aware, default
                    # on) this is the NOMINAL item count on a median-sized graph;
                    # the sampler holds a fixed edge (memory) budget per batch, so
                    # hard instances shrink the batch and easy ones grow it. Every
                    # batch then costs ~= 32 * median-edges, which is LESS peak
                    # memory than a fixed batch-16 all-hard batch used. The
                    # per-batch OOM guard catches any residual tail.
  lr_phase1: 1.0e-3
  lr_phase2: 5.0e-4
  lr_phase3: 5.0e-4
  lr_phase4: 1.0e-4
  lr_phase5: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: true             # automatic mixed precision (GPU only)

data:
  problem: set_cover
  n_rows: 500
  n_cols: 1000
  density: 0.05
  n_instances: 1000
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_train_files: null   # set to integer to cap (e.g. 300 for fast experiments)

paths:
  data_root: data/
  checkpoint_dir: checkpoints/
  results_dir: results/

solver:
  time_limit: 300       # seconds per instance
  node_limit: 100000
  gap_tolerance: 1.0e-4
  max_cuts_per_node: 10
  cut_score_threshold: 0.3   # sigmoid threshold for cut acceptance (legacy learned head)
  # Neural cut gate (H(π) × CTG × depth).
  # cut_depth_max:  only attempt cuts at nodes shallower than this depth (0=root only).
  # cut_entropy_thresh: minimum policy entropy (nats) over fractional vars to fire.
  # cut_ctg_thresh: minimum predicted remaining nodes — skip cheap-to-finish nodes.
  # cut_budget_cap: hard cap on total cuts injected per solve() call.
  cut_depth_max: 3
  force_root_cuts: true       # always attempt cuts at root (depth=0); bypasses entropy/CTG gate
  cut_entropy_thresh_root: 0.2   # root node (depth=0): fire aggressively, highest ROI
  cut_ctg_thresh_root: 10.0      # root node: lower remaining-nodes bar
  cut_entropy_thresh: 0.5        # internal nodes (depth 1-cut_depth_max)
  cut_ctg_thresh: 30.0           # internal nodes: require larger remaining subtree
  cut_budget_cap: 10
  # Latent cut-branch beam search (cut_mode: latent).
  # cut_beam:   beam width for cut candidate evaluation via Dynamics
  # cut_rounds: number of interleaved cut simulation steps per node
  cut_beam: 3
  cut_rounds: 2
  lookahead_k: 3             # candidates evaluated with dynamics lookahead
  lookahead_depth: 3         # latent rollout steps per candidate
  lookahead_gamma: 0.95      # discount factor per lookahead step
  # Rollout scoring: score = value_weight*V(z') - size_weight*S(z') - ctg_weight*C(z')
  # SubtreeSizeHead (S) is the primary signal — directly predicts remaining tree cost.
  # ValueHead (V) adds LP-quality context (complementary, not redundant).
  # CostToGoHead (C) has a linear-countdown target problem (n_steps - t along expert
  # trajectory) — keep ctg_weight 0 until retrained with richer targets.
  # Scale: V is in [0,1], S and C are in log1p space (~0-8) — weights already account
  # for this difference (size_weight 0.7 vs value_weight 0.3 reflects actual scale).
  # SubtreeSizeHead requires subtree_size labels in the dataset. If the head is
  # untrained (non-DFS traces without tree-id tracking), set size_weight: 0.0 and
  # value_weight: 1.0 to fall back to pure value scoring.
  value_weight: 0.3          # LP-bound quality weight
  size_weight: 0.7           # predicted-subtree-size penalty (primary signal)
  ctg_weight: 0.0            # cost-to-go penalty — off until target is improved
  # Rollout branching factor (Gap 4). 1 = single greedy path; >1 expands a
  # predicted branching tree of that width and averages child continuations.
  branch_factor: 2
  # Node selection (Gap 5). "bound" = best-bound (default, LP-bound priority);
  # "cost_to_go" = learned best-first, ordering the frontier by the child's
  # predicted remaining nodes. Order never affects correctness, only speed.
  node_selection: subtree_size    # "bound" | "cost_to_go" | "subtree_size" (default: directly minimise B&B objective)
  # MuZero-style rollout return (Fix 3). true = sum gamma^t r_t + gamma^k V(leaf)
  # using the predicted per-step reward + one leaf value bootstrap; false = sum
  # the value at every step (double-counts; kept as the ablation baseline).
  use_reward_return: true
  # Direction-spread uncertainty penalty. Candidates whose +1/-1 child rollout
  # scores diverge are penalised: score_adj = score - uncertainty_weight * spread.
  # 0.0 = disabled (default). Suggested starting value: 0.1-0.5.
  # Free at runtime — spread uses root-level scores already computed.
  uncertainty_weight: 0.0
  # Confidence-gated rollout. skip_confident: skip rollout when policy top-1 >= threshold.
  # adaptive_conf_high/mid: shrink k and depth for medium/high confidence decisions.
  # null = disabled. Suggested: skip_confident: 0.9, high: 0.70, mid: 0.40
  skip_confident: null
  adaptive_conf_high: null
  adaptive_conf_mid: null
  # Neural pruning gate. Only fires near incumbent bound (lp_obj >= ub*(1-margin)).
  # AND gate: both S(z) > s_thresh AND V(z) < v_thresh required to prune.
  # false by default — enable after SubtreeSizeHead and ValueHead are well-trained.
  neural_prune: false
  neural_prune_s_thresh: 5.0    # log1p subtree size threshold (~148 nodes)
  neural_prune_v_thresh: 0.1    # value head threshold (LP quality very poor)
  neural_prune_margin: 0.1      # only prune when lp_obj within 10% of global_ub
  # Dive bonus: add leaf_prob_child * dive_bonus to child priority.
  # 0.0 = disabled. ~0.5 gives meaningful incumbent-finding bias without
  # overriding the primary node selection signal.
  dive_bonus: 0.5
  # Hierarchical cut gate (two cheap levels before expensive planning).
  # Level 1: IntegralityHead — skip if near-integral.
  # Level 2: cheap scalar signals — n_frac, depth, budget, ΔLP, LP gap, S(z).
  cut_integrality_thresh: 0.7   # IntegralityHead threshold; above → skip cuts
  cut_min_nfrac: 3              # skip cuts when fewer than this many frac. vars
  cut_min_gain: 1.0e-4          # ΔLP stopping rule: if last cut moved LP by less, skip
  cut_subtree_thresh: 1.0       # S(z) gate: skip cuts on subtrees predicted tiny
  # Global search-state context (Gap 1). Injects scalar frontier/bound features
  # into z. GATED OFF: the projection is zero-initialised and the frozen traces
  # lack per-node frontier signals to train it, so it is a no-op until a future
  # run fine-tunes it. Enable only after training the global_proj layer.
  use_global_context: false

benchmark:
  n_instances: 10
  time_limit: 60        # seconds per instance
  problem: set_cover
  lookahead_k: 5             # candidates for dynamics lookahead in benchmark
  lookahead_depth: 3         # latent rollout steps per candidate
  lookahead_gamma: 0.95      # discount factor per lookahead step
  value_weight: 0.3          # LP-bound quality (mirrors solver.value_weight)
  size_weight: 0.7           # subtree-size penalty (primary signal)
  ctg_weight: 0.0            # cost-to-go — off until target is improved
  branch_factor: 2           # rollout tree width (Gap 4); 1 = single path
  use_reward_return: true    # MuZero-style return (mirrors solver.use_reward_return)
  # Confidence gate: skip rollout entirely when softmax top-1 mass >= threshold.
  # null = disabled. Try 0.9 to skip only near-certain decisions.
  skip_confident: null
  # Adaptive rollout compute (items 10+11). Shrinks k and depth for high/medium-
  # confidence decisions so the expensive lookahead focuses on genuinely hard
  # choices. null = disabled (full k/depth always). Suggested starting values:
  #   adaptive_conf_high: 0.70   # p_top >= 0.70 -> k=1, depth=1
  #   adaptive_conf_mid:  0.40   # p_top >= 0.40 -> k=min(K,2), depth=min(D,2)
  adaptive_conf_high: null
  adaptive_conf_mid: null
